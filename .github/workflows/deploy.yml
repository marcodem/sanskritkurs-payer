name: Multi-Platform Docker Build

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_OPTIONS: "--max-old-space-size=16384"

concurrency:
  group: docker-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swap Space (14 GB)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 14G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=14336
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Configure Git for HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build VitePress (Public)
        run: |
          npm install
          VITEPRESS_ENV=public npm run docs:build
          mv docs/.vitepress/dist docs/.vitepress/dist-public

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Public)
        id: meta-public
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Public image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BUILD_DIR=dist-public
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-public.outputs.tags }}
          labels: ${{ steps.meta-public.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate & Upload VitePress PDF & EPUB Release Assets
        run: |
          node scripts/export_vitepress_pdf.js de || true
          node scripts/export_vitepress_pdf.js en || true
          if [ -d "dist_exports" ]; then
            gh release upload "${{ github.ref_name }}" ./dist_exports/*.pdf ./dist_exports/*.epub 2>/dev/null || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
